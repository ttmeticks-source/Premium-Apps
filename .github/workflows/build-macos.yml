name: Build and publish installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher.py"
      - "setup.py"
      - "scripts/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller Pillow customtkinter typing_extensions
      - name: Create app icon
        run: python scripts/make_icon.py
      - name: Build self-contained macOS app
        run: >-
          pyinstaller --clean --noconfirm --windowed
          --name "Premium Apps"
          --icon PremiumApps.icns
          --osx-bundle-identifier com.ttmeticks.premiumapps
          --collect-all customtkinter
          --collect-all darkdetect
          --collect-all typing_extensions
          --collect-all packaging
          launcher.py
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Premium Apps.app" "Premium-Apps-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: Premium-Apps-macOS.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller Pillow customtkinter
      - name: Create app icon
        run: python scripts/make_icon.py
      - name: Build executable
        run: pyinstaller --onefile --windowed --collect-all customtkinter --name "Premium Apps" --icon PremiumApps.ico launcher.py
      - name: Package executable
        run: Compress-Archive -Path "dist/Premium Apps.exe" -DestinationPath "Premium-Apps-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: Premium-Apps-Windows.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish latest downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh release create latest \
            "release-assets/Premium-Apps-macOS.zip" \
            "release-assets/Premium-Apps-Windows.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Premium Apps - Latest" \
            --notes "Latest macOS app and Windows executable. Download the ZIP for your platform."
