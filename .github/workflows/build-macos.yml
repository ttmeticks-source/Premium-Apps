name: Build and publish installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher.py"
      - "setup.py"
      - "scripts/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
            label: Intel
            asset: Premium-Apps-macOS-Intel.zip
          - runner: macos-15
            architecture: arm64
            label: AppleSilicon
            asset: Premium-Apps-macOS-AppleSilicon.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify runner architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller Pillow customtkinter typing_extensions
      - name: Create app icon
        run: python scripts/make_icon.py
      - name: Build self-contained macOS app
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: >-
          pyinstaller --clean --noconfirm --windowed
          --name "Premium Apps"
          --icon PremiumApps.icns
          --osx-bundle-identifier com.ttmeticks.premiumapps
          --collect-all customtkinter
          --collect-all darkdetect
          --collect-all typing_extensions
          --collect-all packaging
          launcher.py
      - name: Verify app executable architecture
        run: |
          APP_EXEC="dist/Premium Apps.app/Contents/MacOS/Premium Apps"
          file "$APP_EXEC"
          lipo -archs "$APP_EXEC" | grep -q "${{ matrix.architecture }}"
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Premium Apps.app" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller Pillow customtkinter typing_extensions
      - name: Create app icon
        run: python scripts/make_icon.py
      - name: Build executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --collect-all customtkinter --collect-all darkdetect --collect-all typing_extensions --collect-all packaging --name "Premium Apps" --icon PremiumApps.ico launcher.py
      - name: Package executable
        run: Compress-Archive -Path "dist/Premium Apps.exe" -DestinationPath "Premium-Apps-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: Premium-Apps-Windows.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish latest downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh release create latest \
            "release-assets/Premium-Apps-macOS-Intel.zip" \
            "release-assets/Premium-Apps-macOS-AppleSilicon.zip" \
            "release-assets/Premium-Apps-Windows.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Premium Apps - Latest" \
            --notes "Choose Intel or Apple Silicon for macOS. Windows users download the Windows ZIP. Runtime dependencies are bundled."
