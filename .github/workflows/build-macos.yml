name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher.py"
      - "setup.py"
      - "scripts/**"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tools
        run: python -m pip install --upgrade pip py2app Pillow
      - name: Create app icon
        run: python scripts/make_icon.py
      - name: Build .app bundle
        run: python setup.py py2app
      - name: Zip app for download
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Premium Apps.app" "Premium-Apps-macOS.zip"
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Premium-Apps-macOS
          path: Premium-Apps-macOS.zip
          if-no-files-found: error
          retention-days: 30
